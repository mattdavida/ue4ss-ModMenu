name: Pages

on:
  push:
    branches: [main]
    paths:
      - "builder/**"
      - "tools/bundle.mjs"
      - "ModMenu.lua"
      - "ConfigManager.lua"
      - "core/**"
      - "shell/**"
      - "store/**"
      - "widgets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Test and build builder
        working-directory: builder
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builder/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
